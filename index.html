<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f100f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap">
  <title>Painel do Montador</title>
</head>
<body>
  <div id="boot" class="spin">Carregando…</div>

  <section id="auth" class="auth" hidden>
    <div class="slot"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v14h14"/><path d="M9 4v10h10"/></svg></div>
    <h1>Painel do Montador</h1>
    <p class="sub">Orçamento, ordem de serviço e tempo real de cada móvel.</p>
    <form id="authForm" class="card stack" novalidate>
      <label class="field"><span class="lbl">E-mail</span><input class="in" id="authEmail" type="email" autocomplete="email" inputmode="email" required></label>
      <label class="field"><span class="lbl">Senha</span><input class="in" id="authPass" type="password" autocomplete="current-password" minlength="6" required></label>
      <label class="chk" id="authTermsRow" hidden><input type="checkbox" id="authTerms"> <span>Li e aceito os <a href="/termos.html" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="/privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>.</span></label>
      <p class="err" id="authErr" role="alert"></p>
      <button class="btn block" id="authGo" type="submit">Entrar</button>
      <button class="linkbtn" id="authSwitch" type="button">Ainda não tenho conta</button>
      <button class="linkbtn" id="authForgot" type="button">Esqueci minha senha</button>
    </form>
    <p class="small muted" style="text-align:center;margin:14px 0 0"><a href="/termos.html" target="_blank" rel="noopener">Termos de Uso</a> · <a href="/privacidade.html" target="_blank" rel="noopener">Privacidade</a></p>
  </section>

  <section id="gate" class="auth" hidden>
    <div class="slot"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h1 id="gateTitle">Acesso pendente</h1>
    <p class="sub" id="gateMsg"></p>
    <div class="card stack">
      <p class="small muted" style="margin:0">Conta: <b id="gateEmail" style="color:var(--fg);overflow-wrap:anywhere"></b></p>
      <button class="btn block" id="gateCheck" type="button">Já comprei, verificar de novo</button>
      <button class="linkbtn" id="gateOut" type="button">Sair</button>
    </div>
  </section>

  <section id="recover" class="auth" hidden>
    <h1>Nova senha</h1>
    <p class="sub">Escolha uma senha nova para a sua conta.</p>
    <form id="recoverForm" class="card stack" novalidate>
      <label class="field"><span class="lbl">Nova senha</span><input class="in" id="recPass" type="password" autocomplete="new-password" minlength="6"></label>
      <label class="field"><span class="lbl">Repita a nova senha</span><input class="in" id="recPass2" type="password" autocomplete="new-password" minlength="6"></label>
      <p class="err" id="recErr" role="alert"></p>
      <button class="btn block" id="recGo" type="submit">Salvar nova senha</button>
    </form>
  </section>

  <div class="app" id="app" hidden>
    <header class="top">
      <button class="slot" id="topLogo" data-a="logo" aria-label="Enviar sua logo"></button>
      <div class="nm"><b id="topName"></b><span>Orçamento, ordem de serviço e tempo real</span></div>
      <span class="rate" id="topRate"></span>
    </header>
    <div id="runBanner" hidden></div>
    <section data-view id="v-inicio"></section>
    <section data-view id="v-orcar"></section>
    <section data-view id="v-orcamentos"></section>
    <section data-view id="v-servico"></section>
    <section data-view id="v-valor"></section>
    <section data-view id="v-agenda"></section>
    <section data-view id="v-caixa"></section>
    <section data-view id="v-tabela"></section>
    <section data-view id="v-prompts"></section>
    <section data-view id="v-mais"></section>
  </div>

  <div class="tabs" id="tabsWrap" hidden><nav id="tabs"></nav></div>
  <input type="file" id="logoFile" accept="image/*" hidden>
  <input type="file" id="fotoFile" accept="image/*" hidden>
  <div id="sheet" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
